name: CI Pipeline

on:
  push:
    branches:
      - "**"
      - "!main"
  pull_request:
    branches:
      - "**"
      - "!main"
  workflow_dispatch:

jobs:
  test:
    runs-on: F74144757

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "backend/.python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.19"

      - name: Install the project
        run: |
          cd backend
          uv sync --locked --all-extras --dev

      # - name: Run unit tests
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     cd backend
      #     uv run pytest tests/unit --cov=src --cov-report=xml --disable-warnings

      - name: Run integration tests (with mock DB)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          uv run pytest tests/integration --cov=src --cov-report=xml --disable-warnings

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

